services:
  - type: web
    name: telegram-enrollment-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 automate.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_APP_PASSWORD
        sync: false
      - key: GOOGLE_TOKEN_B64
        sync: false
